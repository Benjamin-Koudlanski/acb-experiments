[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "acb-experiments"
version = "0.1.0"
description = "Agent Coordination Bound – experimental replication toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Benjamin Koudlanski", email = "koudlanskibenjamin@gmail.com"},
]
keywords = [
    "multi-agent", "LLM", "fleet-sizing", "coordination",
    "benchmark", "AutoGen", "LangChain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "openai>=1.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
acb = "acb.cli:main"

[tool.setuptools.packages.find]
include = ["acb*", "experiments*", "monte_carlo*", "benchmarks*", "analysis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
