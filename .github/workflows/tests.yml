name: ACB Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib seaborn pyyaml httpx python-dotenv pytest pytest-cov

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

      - name: Run Monte Carlo validation (Table 3)
        run: |
          PYTHONPATH=. python -m monte_carlo.validate_pharm --runs 50000 --seed 42

      - name: Run CLI smoke tests
        run: |
          PYTHONPATH=. python -m acb.cli cbi --n-deployed 8 --pass-at-1 0.72 --overhead 0.082
          PYTHONPATH=. python -m acb.cli nstar --pass-at-1 0.72 --overhead 0.082
          PYTHONPATH=. python -m acb.cli pharm --n 5 --mu-a 0.19 --sigma-a 0.07 --mu-c 0.18
          PYTHONPATH=. python -m acb.cli crossover --c-supervisor 0.015 --c-all2all 0.082

      - name: Run greedy fleet selection validation (Table 7)
        run: |
          PYTHONPATH=. python -c "
          from acb.greedy_fleet import greedy_fleet_select
          agents = [
              ('Claude-3.5-Sonnet', 0.89),
              ('GPT-4o', 0.87),
              ('GPT-4o-inst2', 0.86),
              ('GPT-4-Turbo', 0.82),
              ('Gemini-1.5-Pro', 0.79),
              ('GPT-4o-mini', 0.72),
              ('LLaMA-3-70B', 0.57),
          ]
          result = greedy_fleet_select(agents, c=0.082, cross_model_penalty=1.3)
          assert len(result.selected) == 6, f'Expected 6 agents, got {len(result.selected)}'
          assert result.steps[-1].stop, 'Last step should be STOP'
          print(f'Greedy selection: {len(result.selected)} agents, I(S*)={result.total_I:.4f}')
          print('PASS')
          "
